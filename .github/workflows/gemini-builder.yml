name: Gemini Sub Builder (Github-Gemini)

on:
  schedule:
    - cron: "20 5 * * *" # daily ~08:50 Tehran (UTC+3:30), odd minute avoids GitHub Actions :30 queue delays so it runs at ~09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tester.py"
      - "settings.json"
      - ".github/workflows/gemini-builder.yml"

permissions:
  contents: write

concurrency:
  group: gemini-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Xray Core (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo XTLS/Xray-core -p "Xray-linux-64.zip" -D /tmp --clobber
          VER=$(gh release view --repo XTLS/Xray-core --json tagName -q .tagName)
          echo "XRAY_VERSION=$VER" >> "$GITHUB_ENV"
          echo "xray version: $VER"
          unzip -o /tmp/Xray-linux-64.zip xray -d ./bin
          chmod +x ./bin/xray
          ./bin/xray version

      - name: Run Tester
        run: python tester.py --settings settings.json --xray ./bin/xray --out-prefix Github-Gemini

      # Runs only if the tester succeeded (exit 0).
      # If the tester found nothing (exit 3) this step is skipped
      # and the previous subscription file stays untouched.
      - name: Commit new subscription
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Github-Gemini.txt Github-Gemini-plain.txt REPORT.md
          if git diff --cached --quiet; then
            echo "No changes - sub identical to previous run."
          else
            git commit -m "[skip ci] update Github-Gemini sub (xray ${XRAY_VERSION}, $(date -u '+%Y-%m-%d %H:%M') UTC)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
